[project]
name = "preppulse"
version = "0.1.0"
description = "Assistive clinical chart review with source provenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24,<2",
  "pydantic>=2.7,<3",
  "pillow>=10,<12",
  "pytesseract>=0.3.10,<0.4",
  "pymongo>=4.6,<5",
  "numpy>=1.26,<3",
  "rank-bm25>=0.2.2,<1",
  "langchain-core>=0.2,<2",
  "langchain>=0.2,<2",
  "langgraph>=0.1,<2",
  "langchain-openai>=0.1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "itsdangerous>=2.2,<3",
  "pwdlib[argon2]>=0.2,<1",
  "faster-whisper>=1.1,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mongomock>=4.3,<5",
]

[project.scripts]
preppulse-ocr = "preppulse_ocr.engine:main"
preppulse-ingest = "preppulse_ocr.database:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preppulse_ocr", "src/preppulse_db", "src/preppulse_preprocessing", "src/preppulse_rag", "src/preppulse_agents", "src/preppulse_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/preppulse_api/app.py" = ["B008", "BLE001"]  # FastAPI dependency defaults and request/job boundaries
"src/preppulse_api/clinical.py" = ["BLE001"]  # Live model failure degrades to cited excerpts
